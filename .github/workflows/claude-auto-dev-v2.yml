# .github/workflows/claude-auto-dev.yml (これで丸ごと置き換え)
name: Claude Auto Dev

on:
  schedule:
    # UTC表記。JST 9時〜17時の間、2時間おきに起動を試みる
    - cron: "1 0-8/2 * * *"
  workflow_dispatch: {} # 手動実行ボタン
  push:
    branches: [main]
    paths: ["ROADMAP.md"] # ClaudeのPRをマージすると即、次のタスクに着手する(連鎖)

concurrency:
  group: claude-auto-dev
  cancel-in-progress: false

jobs:
  auto-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 未マージのclaude PRがあれば何もしない(重複防止)
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open=$(gh pr list --state open --search "head:claude/" --json number --jq length)
          echo "skip=$([ "$open" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep"
          prompt: |
            あなたはこのリポジトリの自律開発エージェントです。以下を順に実行してください。

            1. ROADMAP.md を読み、未完了「- [ ]」のタスクのうち一番上のものを1つだけ選ぶ
            2. CLAUDE.md のルールに従って、claude/ で始まる新しいブランチ上で実装する
            3. テストを実行し、全て通ることを確認する(通らないならPRを出さず修正する)
            4. ROADMAP.md の該当タスクを「- [x]」に更新して同じブランチにコミットする
            5. mainに向けてPRを作成する。PR本文に「何を・なぜ・どう確認したか」を日本語で書く

            禁止事項:
            - 1回の実行で複数タスクに着手しない
            - mainへの直接push禁止
            - ROADMAP.mdにない機能を勝手に追加しない
            - 未完了タスクが1つもない場合は何もせず終了する
